<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="favPhoenixGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="favHelix" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Badge Background for maximum tab contrast -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="#10B981" stroke-width="2.5" />

  <!-- Phoenix Wings & Helix Centered in 128x128 (shifted so center is at 64,64) -->
  <g transform="translate(11, 4)">
    <!-- Phoenix Left Wing -->
    <path d="M 48 50 C 32 36, 16 20, 5 4 C 13 26, 22 48, 38 64 Z" fill="url(#favPhoenixGreen)" />
    <path d="M 51 58 C 34 48, 19 37, 13 22 C 24 42, 33 58, 45 70 Z" fill="url(#favPhoenixGreen)" opacity="0.9" />
    <path d="M 53 66 C 40 60, 26 52, 21 41 C 30 56, 40 68, 51 76 Z" fill="url(#favPhoenixGreen)" opacity="0.8" />

    <!-- Phoenix Right Wing -->
    <path d="M 58 50 C 74 36, 90 20, 101 4 C 93 26, 84 48, 68 64 Z" fill="url(#favPhoenixGreen)" />
    <path d="M 55 58 C 72 48, 87 37, 93 22 C 82 42, 73 58, 61 70 Z" fill="url(#favPhoenixGreen)" opacity="0.9" />
    <path d="M 53 66 C 66 60, 80 52, 85 41 C 76 56, 66 68, 55 76 Z" fill="url(#favPhoenixGreen)" opacity="0.8" />

    <!-- Phoenix Head & Crown (Gold) -->
    <path d="M 53 18 L 58 29 L 53 37 L 48 29 Z" fill="url(#favGold)" filter="url(#glow)" />
    <circle cx="53" cy="16" r="4" fill="#FDE68A" />
    
    <!-- Central Peptide Double Helix (Emerald & Mint) -->
    <path d="M 47 40 Q 53 51 59 62 Q 53 73 47 84 Q 53 95 59 102" fill="none" stroke="url(#favPhoenixGreen)" stroke-width="4" stroke-linecap="round" />
    <path d="M 59 40 Q 53 51 47 62 Q 53 73 59 84 Q 53 95 47 102" fill="none" stroke="url(#favHelix)" stroke-width="4" stroke-linecap="round" />

    <!-- Helix Base Rungs (Peptide Bonds) -->
    <line x1="50" y1="46" x2="56" y2="46" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
    <line x1="47" y1="62" x2="59" y2="62" stroke="#F59E0B" stroke-width="2.8" stroke-linecap="round" />
    <line x1="50" y1="78" x2="56" y2="78" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
    <line x1="49" y1="94" x2="57" y2="94" stroke="#F59E0B" stroke-width="2.8" stroke-linecap="round" />

    <!-- Core Energy Crystal / Tail -->
    <path d="M 53 100 L 56 110 L 53 114 L 50 110 Z" fill="url(#favGold)" />
  </g>
</svg>