<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <radialGradient id="coaBg_aod9604" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </radialGradient>
    <filter id="coaShadow_aod9604" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="400" height="480" fill="url(#coaBg_aod9604)"/>

  <g filter="url(#coaShadow_aod9604)">
    <!-- Paper Sheet -->
    <rect x="35" y="25" width="330" height="430" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Header bar -->
    <rect x="35" y="25" width="330" height="45" rx="8 8 0 0" fill="#0F172A"/>
    <text x="50" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#38BDF8" letter-spacing="1">PHOENICS ANALYTICAL LABORATORIES</text>
    <text x="50" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#94A3B8">CERTIFICATE OF ANALYSIS (RP-HPLC &amp; ESI-MS)</text>
    <rect x="300" y="36" width="55" height="18" rx="4" fill="#059669"/>
    <text x="327" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" fill="#FFFFFF" text-anchor="middle">PASS</text>

    <!-- Product Details Block -->
    <rect x="48" y="80" width="304" height="68" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="58" y="96" font-family="'Cormorant Garamond', serif" font-size="16" font-weight="700" fill="#0F172A">AOD-9604 (5mg)</text>
    <text x="58" y="112" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748B">CAS: 221231-10-3 &bull; LOT: PHX-AOD-5412</text>
    <text x="58" y="126" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748B">MW: 1815.10 g/mol &bull; METHOD: C18 RP-HPLC</text>
    <text x="58" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#059669">CONFIRMED PURITY: 99.4%</text>

    <!-- HPLC Chromatogram Window -->
    <rect x="48" y="158" width="304" height="170" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="58" y="174" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#0F172A">REVERSE PHASE HPLC CHROMATOGRAM (214nm)</text>

    <!-- Grid lines -->
    <line x1="75" y1="185" x2="335" y2="185" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="75" y1="215" x2="335" y2="215" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="75" y1="245" x2="335" y2="245" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="75" y1="275" x2="335" y2="275" stroke="#F1F5F9" stroke-width="1"/>

    <!-- Axes -->
    <line x1="75" y1="185" x2="75" y2="305" stroke="#64748B" stroke-width="1.5"/>
    <line x1="75" y1="305" x2="335" y2="305" stroke="#64748B" stroke-width="1.5"/>

    <!-- Sharp Single HPLC Peak (High Purity) -->
    <path d="M 75 304 L 140 304 Q 165 304 175 300 L 195 200 L 200 192 L 205 200 L 225 300 Q 235 304 260 304 L 335 304" fill="none" stroke="#22C55E" stroke-width="2.5"/>

    <!-- Peak Label -->
    <circle cx="200" cy="192" r="3" fill="#DC2626"/>
    <text x="200" y="184" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#0F172A" text-anchor="middle">Main Peak (99.4%)</text>
    <text x="200" y="320" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#64748B" text-anchor="middle">Retention Time: 14.82 min</text>

    <!-- Certification Footer -->
    <line x1="48" y1="340" x2="352" y2="340" stroke="#E2E8F0" stroke-width="1"/>
    <text x="58" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#0F172A">QUALITY CONTROL AUDIT</text>
    <text x="58" y="375" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#64748B">MASS SPEC (ESI+): Consistent with theoretical [M+H]+</text>
    <text x="58" y="390" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#64748B">RESIDUAL SOLVENTS: Compliant with USP &lt;467&gt; Limits</text>
    <text x="58" y="405" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#64748B">ENDOTOXIN (LAL): &lt; 0.05 EU/mg</text>

    <!-- Sign-off stamp -->
    <rect x="255" y="360" width="95" height="48" rx="4" fill="#F8FAFC" stroke="#94A3B8" stroke-dasharray="3 3"/>
    <text x="302" y="378" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="800" fill="#059669" text-anchor="middle">QA VERIFIED</text>
    <text x="302" y="392" font-family="'JetBrains Mono', monospace" font-size="6.5" fill="#64748B" text-anchor="middle">Dr. H. Chen, PhD</text>
    <text x="302" y="402" font-family="'JetBrains Mono', monospace" font-size="6" fill="#94A3B8" text-anchor="middle">Sep 2026 Audit</text>

    <!-- Footer RUO notice -->
    <rect x="35" y="425" width="330" height="30" rx="0 0 8 8" fill="#F8FAFC"/>
    <text x="200" y="443" font-family="'JetBrains Mono', monospace" font-size="6.5" fill="#94A3B8" text-anchor="middle">FOR RESEARCH USE ONLY (21 CFR § 312.160) &bull; NOT FOR HUMAN CONSUMPTION</text>
  </g>
</svg>